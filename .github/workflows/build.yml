# Builds the Linux packages (.deb, .rpm, AppImage, .tar.gz) and the Windows
# .zip on every push to main (downloadable from the run). A tag like v1.2.0
# also publishes them as a GitHub release.
name: Build
run-name: "${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Build · {0}', github.ref_name) }}"

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main replaces the build of the older one; a release
# (tag) always finishes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  package:
    name: Package (${{ matrix.target }})
    # Ubuntu 22.04's older system libraries let one Linux binary run on
    # Ubuntu 22.04+, Debian 12+ and Fedora 36+. The Mac app is built on a
    # Mac (WKWebView and cgo need Apple's SDK).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
          - target: windows
            os: ubuntu-22.04
          - target: macos
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # per-target cache below
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-package-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: go-package-${{ matrix.target }}-
      # linuxdeploy and its GTK plugin (scripts/package.sh fetches them once).
      - uses: actions/cache@v4
        if: matrix.target == 'linux'
        with:
          path: |
            build/linuxdeploy
            build/linuxdeploy-plugin-gtk.sh
          key: appimage-tools-${{ hashFiles('scripts/package.sh') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install WebKitGTK
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Build the web UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package
        run: scripts/package.sh ${{ matrix.target }} "$VERSION"
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: gotable-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes read the commits since the previous tag
      - name: Write the release notes
        run: scripts/release-notes.sh "${{ github.ref_name }}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
