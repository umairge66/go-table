# Builds the Linux packages (.deb, .rpm, AppImage, .tar.gz) and the Windows
# .zip on every push to main (downloadable from the run). A tag like v1.2.0
# also publishes them as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    # Ubuntu 22.04's older system libraries let one Linux binary run on
    # Ubuntu 22.04+, Debian 12+ and Fedora 36+.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install WebKitGTK
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Build the web UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package
        run: scripts/package.sh ${{ matrix.target }} "$VERSION"
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: gotable-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
