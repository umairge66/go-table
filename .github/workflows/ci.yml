# Tests on every push and pull request, as parallel jobs so the run takes as
# long as the slowest one: frontend checks, Go vet, Go tests against real
# PostgreSQL / MySQL / MariaDB / SQL Server / ClickHouse servers (and DuckDB,
# SQLite files), and the end-to-end tests.
name: CI
# Shown in the Actions list, so the test run is told apart from Build's.
run-name: "Tests · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }}"

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Types and unit tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc -p .
          npx vitest run

  vet:
    name: Go vet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # per-job cache below; a shared key keeps only one job's builds
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-vet-${{ hashFiles('go.sum') }}
          restore-keys: go-vet-
      - name: Install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Go vet (desktop and browser builds)
        run: |
          go vet -tags desktop,production,webkit2_41 ./...
          go vet -tags browser ./cmd/...

  go:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: gotable-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gotable-test
          MYSQL_DATABASE: gotable
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgotable-test" --health-interval 3s --health-timeout 5s --health-retries 40
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: gotable-test
          MARIADB_DATABASE: gotable
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 3s --health-timeout 5s --health-retries 40
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: GoTable-test1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P GoTable-test1 -Q 'SELECT 1'" --health-interval 3s --health-timeout 5s --health-retries 40
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: gotable
          CLICKHOUSE_PASSWORD: gotable-test
          CLICKHOUSE_DB: gotable
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["9000:9000"]
        options: >-
          --health-cmd "clickhouse-client --user gotable --password gotable-test -q 'SELECT 1'" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      GOTABLE_TEST_PG_HOST: 127.0.0.1
      GOTABLE_TEST_PG_PORT: "5432"
      GOTABLE_TEST_PG_USER: postgres
      GOTABLE_TEST_PG_PASSWORD: gotable-test
      GOTABLE_TEST_PG_DB: postgres
      GOTABLE_TEST_MYSQL_HOST: 127.0.0.1
      GOTABLE_TEST_MYSQL_PORT: "3306"
      GOTABLE_TEST_MYSQL_USER: root
      GOTABLE_TEST_MYSQL_PASSWORD: gotable-test
      GOTABLE_TEST_MYSQL_DB: gotable
      GOTABLE_TEST_MARIADB_HOST: 127.0.0.1
      GOTABLE_TEST_MARIADB_PORT: "3307"
      GOTABLE_TEST_MARIADB_USER: root
      GOTABLE_TEST_MARIADB_PASSWORD: gotable-test
      GOTABLE_TEST_MARIADB_DB: gotable
      GOTABLE_TEST_MSSQL_HOST: 127.0.0.1
      GOTABLE_TEST_MSSQL_PORT: "1433"
      GOTABLE_TEST_MSSQL_USER: sa
      GOTABLE_TEST_MSSQL_PASSWORD: GoTable-test1
      GOTABLE_TEST_MSSQL_DB: master
      GOTABLE_TEST_CH_HOST: 127.0.0.1
      GOTABLE_TEST_CH_PORT: "9000"
      GOTABLE_TEST_CH_USER: gotable
      GOTABLE_TEST_CH_PASSWORD: gotable-test
      GOTABLE_TEST_CH_DB: gotable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ hashFiles('go.sum') }}
          restore-keys: go-test-
      # cmd/gotable has no tests; vet builds it (with WebKitGTK).
      - name: Go tests (SQLite, DuckDB, PostgreSQL, MySQL, MariaDB, SQL Server, ClickHouse)
        run: go test -race -count=1 ./internal/...

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: gotable-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: GoTable-test1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P GoTable-test1 -Q 'SELECT 1'" --health-interval 3s --health-timeout 5s --health-retries 40
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: gotable
          CLICKHOUSE_PASSWORD: gotable-test
          CLICKHOUSE_DB: gotable
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["9000:9000"]
        options: >-
          --health-cmd "clickhouse-client --user gotable --password gotable-test -q 'SELECT 1'" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ hashFiles('go.sum') }}
          restore-keys: go-e2e-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web UI
        working-directory: frontend
        run: npm ci && npm run build
      # The browser build is the same app without the native window, so it
      # needs no WebKitGTK; cgo stays on for DuckDB.
      - name: Build the app
        run: go build -tags browser -o bin/gotable ./cmd/gotable
      - name: Demo data for the PostgreSQL scenario
        run: psql "postgres://postgres:gotable-test@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -f scripts/e2e-demo.sql
      - name: End-to-end tests (Chrome)
        working-directory: frontend
        env:
          GOTABLE_E2E_PG: postgres://postgres:gotable-test@127.0.0.1:5432/postgres?sslmode=disable
          GOTABLE_E2E_COMPAT: >-
            sqlserver://sa:GoTable-test1@127.0.0.1:1433?database=master
            clickhouse://gotable:gotable-test@127.0.0.1:9000/gotable
            duckdb:///tmp/gotable-compat.duckdb
        run: npx playwright test
      - name: Keep the end-to-end traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/test-results
          retention-days: 7
